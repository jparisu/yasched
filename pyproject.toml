[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yasched"
version = "2.0.0"
description = "Version 2.0 of the My Yaml Scheduler project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "jparisu", email = "javier.paris.u@gmail.com" },
]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",

]

[project.scripts]
yasched = "apps.cli.yasched_cli:main"

[project.urls]
Homepage = "https://github.com/jparisu/yasched"
Repository = "https://github.com/jparisu/yasched"
Issues = "https://github.com/jparisu/yasched/issues"



[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "codespell>=2.4.1",
  "coverage[toml]>=7.8.0",
  "mkdocs>=1.6.0",
  "mkdocs-include-markdown-plugin>=7.0.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
  "ruff>=0.11.0",
  "twine>=6.1.0",
  "types-PyYAML",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-include-markdown-plugin>=7.0.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
]
lint = [
  "codespell>=2.4.1",
  "mypy>=1.15.0",
  "ruff>=0.11.0",
  "types-PyYAML",
]
test = [
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
]
frontend = [
  "reflex>=0.6.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yasched", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "UP046",
  "UP047",
  "B024",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Body",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Cookie",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["yasched"]

[[tool.mypy.overrides]]
module = "yasched.frontending.*"
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["yasched"]

[tool.coverage.report]
show_missing = true
skip_covered = false
