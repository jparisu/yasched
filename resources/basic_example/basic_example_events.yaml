# Sample yasched configuration file
# This demonstrates various events configurations

- id: math_classes
  topic: classes
  name: Math Classes
  description: Hours for math classes
  location: "Room 101, Faculty of Sciences"  # Free text location: room name, address, or URL
  schedule:
    - type: weekly  # An event can be arranged in a weekly schedule, with one or various appointments
      week_days: [monday, wednesday, friday]
      start_time: 10:00
      duration: 1h
      end_date: 2026-01-01

- id: bio_classes
  topic: classes
  name: Biology Classes
  description: Hours for biology classes
  location: "Room 204, Faculty of Sciences"
  schedule:
    - type: weekly
      appointments:  # In this case, the appointments are defined with more detail, allowing to specify different times for each day.
        - week_day: tuesday
          start_time: 14:00
          end_time: 15:30
        - week_day: thursday
          start_time: 14:00
          duration: 1h
      start_date: 2025-09-01
      end_date: 2026-01-01

- id: math_exam
  topic: exams
  name: Math Exam
  description: Math exam on January 15th, 2026
  location: "Room 201, Faculty of Sciences"
  schedule:  # This event happens on a specific day, with a specific time and duration.
    day: 2026-01-15
    start_time: 09:00
    duration: 3h
  layout: important  # An event inherits layout from topic, unless overridden.

- id: xmas
  topic: my  # Events should always belong to a topic for proper categorization and layout inheritance
  name: Christmas Holidays
  description: Christmas holidays
  schedule:  # This event happens once, but it lasts several days.
    start_day: 2025-12-23
    end_day: 2026-01-06
  layout:
    background:
      color: red
  blocking_level: 2  # Events with a blocking_level flag other events that overlap during their timespan.
                     # Overlapping events with a lower or equal blocking_level are shown with a visual warning.
                     # Tasks are not affected by blocking_level.

- id: team_sync
  topic: my
  name: Team Sync
  description: Weekly team synchronization meeting
  location: "https://meet.example.com/team-sync"  # Location can also be a URL for virtual meetings
  schedule:
    - type: weekly
      week_days: [friday]
      start_time: 15:00
      duration: 30m
