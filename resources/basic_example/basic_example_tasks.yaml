# Sample yasched configuration file
# This demonstrates various tasks configurations

- id: math_study
  topic: exams
  events:
    - math_exam  # Shorthand: linking an event provides both context (task shown alongside event)
                 # and deadline sync (task deadline defaults to the event's date).
                 # Use structured form to override: {id: math_exam, use_as_deadline: false}
  name: Math Study
  description: Study time for the math exam
  priority: 5  # Priority level of the task, from 1 (lowest) to inf
  effort:
    min: 10h  # Minimum estimated effort to complete the task
    max: 20h  # Maximum estimated effort to complete the task
  status: in_progress


- id: xmas
  topic: my
  tags:  # Tags are inherited from topic, but can be overridden here
    - holidays
  name: Prepare Christmas
  description: Christmas preparations
  deadline: 2025-12-24
  priority: 4
  status: todo

- id: xmas_gifts
  parent: xmas  # This task is a subtask of "Prepare Christmas". It inherits topic, tags, and layout from its parent.
  name: Buy Christmas Gifts
  description: Time to buy Christmas gifts for family and friends.
  deadline: 2025-12-20
  priority: 3
  effort:
    min: 2h
    max: 5h
  status: blocked  # Explicitly blocked — cannot proceed until dependency is resolved
  blocked:
    - description: "Blocked until knowing targets' preferences"
      by: xmas_gifts_list  # This task is blocked until the task with id "xmas_gifts_list" is completed.

- id: xmas_gifts_list
  parent: xmas
  name: Make Christmas Gifts List
  description: Make a list of gifts to buy for Christmas.
  deadline: 2025-12-15
  priority: 2
  effort:
    min: 30m
    max: 1h
  status: done

- id: xmas_cancelled_trip
  parent: xmas
  name: Book Christmas Trip
  description: Book flights and accommodation for a holiday trip.
  deadline: 2025-12-10
  priority: 3
  status: cancelled  # This task was dropped; plans changed

- id: weekly_review
  topic: my
  name: Weekly Review
  description: Review completed tasks and plan the upcoming week.
  schedule:  # Recurring tasks use the same schedule syntax as events
    - type: weekly
      week_days: [monday]
      start_time: 09:00
      duration: 1h
  effort:
    min: 30m
    max: 2h
  status: todo

- id: monthly_budget
  topic: my
  name: Monthly Budget Review
  description: Review monthly expenses and adjust budget accordingly.
  schedule:
    - type: monthly
      day_of_month: 1  # First day of each month
      start_time: 10:00
      duration: 30m
  effort:
    min: 20m
    max: 1h
  status: todo

- id: yearly_medical
  topic: my
  name: Annual Medical Checkup
  description: Schedule and attend yearly general medical checkup.
  schedule:
    - type: yearly
      month: january
      day: 15
  effort:
    min: 2h
    max: 4h
  status: todo
