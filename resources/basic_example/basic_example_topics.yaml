# Sample yasched configuration file
# This demonstrates various topics configurations

- id: uni  # This is the unique identifier for the topic
  name: University  # This is the human-readable name for the topic
  description: A topic related to university life, studies, and academic activities.  # This is a brief description of the topic
  tags:
    - education  # This is a tag that can be used for categorization or filtering
  layout:
    background:
      color: blue  # Layout could be defined in place or reference a predefined layout by id.

- id: exams
  name: Exams
  description: A topic focused on exams, including preparation, tips, and experiences.
  parents:
    - uni  # This topic is a subtopic of "University" topic. It inherits layout and tags

- id: classes
  name: Classes
  description: A topic about classes, including schedules, subjects, and class-related activities.
  parents:
    - uni

- id: my
  name: My Personal Life
  description: A topic about my personal life, including hobbies, interests, and daily activities.
  tags:
    - personal
    - holidays
  layout: my_layout  # This topic uses a layout previously defined with the id "my_layout"
