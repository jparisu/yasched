  name: University
  description: A topic related to university life, studies, and academic activities.
  tags:
  - education
  layout:
    background:
      type: solid
      color: '#0000ff'
- id: exams
  name: Exams
  description: A topic focused on exams, including preparation, tips, and experiences.
