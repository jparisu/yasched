# =============================================================================
# Tasks: units of work. May be one-off (deadline attribute), recurring
# (`schedules`), or a subtask (`parent_id`, for decomposition). Cross-entity
# links: `relations` (task -> task) and `event_links` (task -> event).
# =============================================================================

# --- Parent task, decomposed into subtasks below ---
- id: prepare-math101
  name: "Prepare Math 101 course"
  topic_ids: [math-101]
  tags: [prep]
  attributes:
    status: in-progress
  layout:
    icon: { type: emoji, value: "📚" }

# subtask: inherits topic (math-101) + layout from parent; own attrs override
- id: write-syllabus
  name: "Write syllabus"
  parent_id: prepare-math101
  traits: [easy]                     # difficulty=easy
  attributes:
    status: done
    effort: { min: 2h, max: 4h }

# subtask: two traits layered (hard then focus)
- id: make-slides
  name: "Make lecture slides"
  parent_id: prepare-math101
  traits: [hard, focus]              # difficulty=hard + red border + kanban=on-focus
  attributes:
    effort: { min: 1d, max: 3d }

# subtask: only default/parent-inherited values
- id: prepare-exercises
  name: "Prepare exercise sheets"
  parent_id: prepare-math101
  attributes:
    status: todo

# --- Task linked to an event + several relation types ---
- id: grade-midterm
  name: "Grade midterm exams"
  topic_ids: [math-101]
  traits: [high-priority, focus]     # priority=5 (overrides default 1) + 🔥 pin
  attributes:
    deadline: "2026-10-27"
  event_links:
    - { event: midterm-exam, use_as_deadline: true, as_context: true }
  relations:
    - { task: make-slides, type: needs }                                  # soft dep
    - { task: prepare-exercises, type: requires, description: "Answer key first" }  # hard dep

# --- RECURRING task (schedules on a task) ---
- id: grade-weekly-quizzes
  name: "Grade weekly quizzes"
  topic_ids: [math-101]
  traits: [backlog]                  # kanban=backlog
  schedules:
    - { type: weekly, week_days: [friday], start_time: "16:00", duration: 30m }

# --- MULTI-TOPIC task (order matters when resolving topic layers) ---
- id: submit-grades
  name: "Submit final grades"
  topic_ids: [math-101, admin]
  attributes:
    deadline: "2026-10-30"
    priority: 4                      # own inline overrides default (1) and any trait
  relations:
    - { task: grade-midterm, type: requires }

# --- Research task under two topics (one is the multi-parent DAG topic) ---
- id: literature-review
  name: "Literature review"
  topic_ids: [research, thesis-supervision]
  attributes:
    status: in-progress

# --- Research paper: arbitrary open attribute + `connected`/`similar` relations ---
- id: write-paper
  name: "Write research paper"
  topic_ids: [research]
  traits: [hard]
  tags: [writing]                    # union with research's [work] -> [work, writing]
  attributes:
    deadline: "2026-12-01"
    effort: { min: 5d, max: 3w }     # weeks unit
    reviewer: "Dr. Smith"            # arbitrary open attribute (openness demo)
  relations:
    - { task: literature-review, type: requires }
    - { task: submit-grades, type: connected }
    - { task: make-slides, type: similar }

# --- Relation SHORTHAND (bare string -> type defaults to "connected") ---
- id: renew-contract
  name: "Renew teaching contract"
  topic_ids: [admin]
  attributes:
    deadline: "2026-08-25"
  event_links:
    - { event: academic-year-start, as_context: true }   # context only (not a deadline)
  relations:
    - submit-grades                  # shorthand string relation
