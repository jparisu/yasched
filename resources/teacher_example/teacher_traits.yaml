# =============================================================================
# Traits: reusable named bundles of attributes and/or layout.
# A trait is attached to an element via its `traits: [...]` list and merged as
# a layer (in listed order) between the topic layers and the parent layer.
#
# Demonstrates the three trait shapes:
#   - attributes-only  (easy, focus, backlog)
#   - layout-only       (exam-style, recurring-style)  == v2 "named layout"
#   - both              (hard, high-priority)
# =============================================================================

# attributes-only
easy:
  attributes:
    difficulty: easy

focus:
  attributes:
    kanban: on-focus

backlog:
  attributes:
    kanban: backlog

# both attributes and layout
hard:
  attributes:
    difficulty: hard
  layout:
    border: { type: solid, width: 2px, color: red }   # named color

high-priority:
  attributes:
    priority: 5
  layout:
    pin: { color: red, icon: "🔥" }

# layout-only (a "named layout")
exam-style:
  layout:
    icon: { type: emoji, value: "📝" }
    background: { type: solid, color: "#fde68a" }

recurring-style:
  layout:
    icon: { type: emoji, value: "🔁" }
