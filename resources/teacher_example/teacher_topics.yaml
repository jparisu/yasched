# =============================================================================
# Topics: organizational categories forming a DAG via `parent_ids`.
# Tags and layout/attributes inherit down to child topics and to the
# events/tasks that reference them.
# =============================================================================

# --- Root topics ---
- id: teaching
  name: Teaching
  description: "All teaching-related work"
  tags: [work]
  attributes:
    color-group: teaching          # arbitrary open attribute
  layout:
    # bottom-left gradient anchor; composes with math-101's top-right anchor
    background: { type: gradient_bl, color: "#3b82f6" }

- id: research
  name: Research
  tags: [work]
  layout:
    background: { type: solid, color: "#10b981" }

- id: admin
  name: Administration
  tags: [work, bureaucracy]

- id: personal
  name: Personal
  tags: [personal]                 # NO `work` tag — verify it does not leak in

# --- Child topics (single parent) ---
- id: math-101
  name: "Math 101 (Undergraduate)"
  parent_ids: [teaching]
  tags: [undergrad]                # union with teaching's [work] -> [work, undergrad]
  layout:
    # top-right gradient anchor; composes with teaching's bottom-left anchor
    background: { type: gradient_tr, color: "#f59e0b" }

- id: math-201
  name: "Math 201 (Graduate)"
  parent_ids: [teaching]
  tags: [grad]

# --- Child topic with MULTIPLE parents (true DAG) ---
- id: thesis-supervision
  name: "Thesis Supervision"
  parent_ids: [teaching, research]   # inherits from both, in listed order
  tags: [supervision]
