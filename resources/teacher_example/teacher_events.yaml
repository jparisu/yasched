# =============================================================================
# Events: time-bound occurrences. Recurrence is expressed with `schedules`
# (one or more of: weekly, monthly, yearly, single_day, multi_day).
# A "sub-event" (via `parent_id`) overrides ONE occurrence of a recurring event.
# =============================================================================

# --- Recurring weekly lecture (duration form) ---
- id: math101-lecture
  name: "Math 101 Lecture"
  topic_ids: [math-101]
  traits: [recurring-style]
  attributes:
    location: "Room A-12"
  schedules:
    - { type: weekly, week_days: [monday, wednesday], start_time: "10:00", duration: 1h }

# --- SUB-EVENT: one occurrence moved to another room (override via parent_id) ---
# Inherits everything from math101-lecture; overrides only location + this date.
- id: math101-lecture-move
  name: "Math 101 Lecture (moved)"
  parent_id: math101-lecture
  attributes:
    location: "Room B-03 (moved)"
  schedules:
    - { type: single_day, day: "2026-09-16", start_time: "10:00", duration: 1h }

# --- SUB-EVENT via `__ext__`: cancelled occurrence built from a shared file ---
# The template supplies status=cancelled, the ❌ icon and the `cancelled` tag;
# the sibling keys below add identity + the specific date.
- __ext__: _event_cancel_template.yaml
  id: math101-lecture-cancel
  name: "Math 101 Lecture (cancelled 23 Sep)"
  parent_id: math101-lecture
  schedules:
    - { type: single_day, day: "2026-09-23" }

# --- Weekly office hours (end_time form instead of duration) ---
- id: office-hours
  name: "Office Hours"
  topic_ids: [teaching]
  schedules:
    - { type: weekly, week_days: [friday], start_time: "15:00", end_time: "17:00" }

# --- Monthly faculty meeting ---
- id: faculty-meeting
  name: "Faculty Meeting"
  topic_ids: [admin]
  traits: [recurring-style]
  schedules:
    - { type: monthly, day: 1, start_time: "09:00", duration: 1h }

# --- MULTI-TOPIC event (belongs to two topics; order matters for resolution) ---
- id: dept-seminar
  name: "Department Seminar"
  topic_ids: [research, teaching]
  schedules:
    - { type: weekly, week_days: [thursday], start_time: "13:00", duration: 90m }

# --- One-off exam (single_day) with blocking_level + traits ---
- id: midterm-exam
  name: "Math 101 Midterm Exam"
  topic_ids: [math-101]
  traits: [exam-style, high-priority]
  attributes:
    location: "Main Hall"
    blocking_level: 3               # flags overlapping lower-level events
  schedules:
    - { type: single_day, day: "2026-10-20", start_time: "09:00", duration: 2h }

# --- Yearly all-day event (no time) ---
- id: academic-year-start
  name: "Academic Year Starts"
  topic_ids: [admin]
  schedules:
    - { type: yearly, month: 9, day: 1 }

# --- Multi-day event ---
- id: research-conference
  name: "Annual Research Conference"
  topic_ids: [research]
  attributes:
    location: "Berlin"
  schedules:
    - { type: multi_day, start_day: "2026-11-10", end_day: "2026-11-13" }

# --- Personal yearly event with fully INLINE layout + tags (no work leakage) ---
- id: birthday
  name: "Birthday"
  topic_ids: [personal]
  tags: [celebration]               # union with personal's [personal]
  layout:
    background: { type: solid, color: "#ec4899" }
    icon: { type: emoji, value: "🎂" }
    pin: { color: "#ec4899", icon: "🎉" }
  schedules:
    - { type: yearly, month: 3, day: 14 }
