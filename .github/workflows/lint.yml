name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Upgrade pip first to keep dependency resolution stable.
          python -m pip install --upgrade pip
          # Install the project with the tool versions used by local checks.
          python -m pip install -e ".[dev]"

      - name: Run pre-commit
        run: |
          # Run the same local quality gate used before commits.
          pre-commit run --all-files
